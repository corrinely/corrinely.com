<!DOCTYPE html><html class="dark" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>The Archive</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&amp;family=Special+Elite&amp;family=Caveat:wght@400;700&amp;display=swap" rel="stylesheet">
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#f2ca50",
                        "surface": "#131313",
                        "background": "#131313",
                        "primary-container": "#d4af37",
                        "parchment-aged": "#C9B693",
                        "gold-leaf": "#B8860B",
                        "forest-shadow": "#1B241A",
                        "ink-black": "#0A0A0A",
                        "on-background": "#e5e2e1",
                        "on-surface": "#e5e2e1",
                        "outline": "#99907c",
                        "charcoal-deep": "#121212"
                    },
                    "fontFamily": {
                        "headline-lg": ["Libre Caslon Text"],
                        "label-caps": ["Special Elite"],
                        "handwritten": ["Caveat"]
                    }
                }
            }
        }
    </script>
<style>
        /* Custom Styles for Atmospheric Effects */
        body {
            background-color: #0e0e0e;
            background-image:
                radial-gradient(circle at 50% 50%, #1c1b1b 0%, #0e0e0e 70%, #000000 100%),
                linear-gradient(rgba(0, 0, 0, 0.3) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 0, 0, 0.3) 1px, transparent 1px);
            background-size: 100% 100%, 20px 20px, 20px 20px;
            background-attachment: fixed;
        }

        .gold-glow {
            box-shadow: 0 10px 30px -5px rgba(184, 134, 11, 0.2), inset 0 0 20px rgba(184, 134, 11, 0.1);
        }

        .candlelight {
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(circle at 50% 50%, rgba(255, 170, 0, 0.08) 0%, rgba(255, 120, 0, 0.02) 60%, transparent 100%);
            animation: flicker 6s infinite alternate ease-in-out;
            z-index: 50;
            mix-blend-mode: overlay;
        }

        @keyframes flicker {
            0%, 100% { opacity: 0.7; transform: scale(1); }
            25% { opacity: 0.8; transform: scale(1.01); }
            50% { opacity: 0.6; transform: scale(0.99); }
            75% { opacity: 0.9; transform: scale(1.02); }
        }
    </style>
</head>
<body class="text-on-surface min-h-screen flex flex-col font-body-md overflow-x-hidden selection:bg-gold-leaf selection:text-ink-black">
<!--
     To be considered as a fellow adventurer, email corrineb [at] gmail [dot] com
-->
<div class="candlelight"></div>
<!-- Gallery Wall -->
<main class="flex-grow flex items-center justify-center relative p-8 z-10 min-h-screen w-full">
<div class="relative w-full max-w-6xl mx-auto flex items-center justify-center py-12">
<!-- The Centerpiece -->
<div class="relative w-full z-30 shrink-0 max-w-xl">
<div class="absolute inset-0 bg-primary-container opacity-5 blur-3xl rounded-full scale-110"></div>
<div class="relative rounded-sm shadow-[0_20px_50px_rgba(0,0,0,0.8)] gold-glow">
<div class="p-4 border-2 border-black/80 bg-[#1a1c19] shadow-[inset_0_0_20px_rgba(0,0,0,0.9)]">
<div class="relative overflow-hidden border-2 border-black/90 bg-charcoal-deep shadow-[0_0_15px_rgba(0,0,0,0.8)]">
<img alt="" class="w-full h-auto object-cover select-none pointer-events-none" src="../images/adventures/ladi-dadi-portrait.jpg">
</div>
</div>
</div>
</div>
</div>
</main>
</body></html>
